# Perfil de producción (Railway). Uso: SPRING_PROFILES_ACTIVE=prod
# Todo viene de variables de entorno; si falta alguna, la aplicación no arranca (a propósito).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Primer arranque: update (crea las tablas). Cuando las tablas existan, cambiar a validate.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

# Railway termina el HTTPS en su proxy: confiar en X-Forwarded-* para que Spring sepa que la petición es segura.
server.forward-headers-strategy=framework
server.error.include-stacktrace=never
