server.port=8080

# ---- MySQL (Avance 2, sin cambios en el Avance 3) ----
# La conexión se lee de variables de entorno: DB_USER (por defecto root) y DB_PASSWORD (por defecto root).
# No escribas aquí tu contraseña real: defínela con la variable de entorno DB_PASSWORD.
# En la nube (perfil prod) la conexión viene de DB_URL, DB_USER y DB_PASSWORD (ver application-prod.properties).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/denuncias_maxuhle?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# ---- Avance 3 / despliegue ----
# Puerto: Railway inyecta PORT; en local sigue siendo 8080.
server.port=${PORT:8080}
# Nunca devolver trazas de error al cliente.
server.error.include-stacktrace=never
# Orígenes permitidos por CORS (lista separada por comas, sin comodín). En local: Angular en el 4200.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
